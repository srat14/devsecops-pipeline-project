name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write # SARIF raporlarını GitHub Security sekmesine yazmak için

jobs:
  # 1. KAPI: GİZLİ ANAHTAR VE STATİK KOD ANALİZİ (SAST)
  secret-and-sast:
    name: "Gate 1: Secret & SAST Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/fastapi
            p/owasp-top-ten

  # 2. KAPI: ALTYAPI KODU GÜVENLİĞİ (IaC SCAN)
  iac-security:
    name: "Gate 2: Terraform IaC Scan"
    runs-on: ubuntu-latest
    needs: secret-and-sast
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov IaC Scanner
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false # Hata bulunduğunda pipeline'ı kır (Hard-Fail)
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload Checkov SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif

  # 3. KAPI: KONTEYNER İMAJ VE BAĞIMLILIK TARAMASI (SCA & CONTAINER)
  container-security:
    name: "Gate 3: Build & Trivy Image Scan"
    runs-on: ubuntu-latest
    needs: iac-security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t devsecops-demo-api:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-demo-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Yüksek/Kritik zafiyet varsa pipeline'ı kır
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # 4. KAPI: ÇALIŞAN UYGULAMA ÜZERİNDE DİNAMİK TEST (DAST)
  dast-scan:
    name: "Gate 4: OWASP ZAP Dynamic Scan"
    runs-on: ubuntu-latest
    needs: container-security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Run Container in Background
        run: |
          docker build -t devsecops-demo-api:test .
          docker run -d --name api-test -p 8000:8000 devsecops-demo-api:test
          sleep 5
          curl -f http://localhost:8000/health

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000/openapi.json'
          fail_action: true # Yüksek riskli DAST bulgusunda kır